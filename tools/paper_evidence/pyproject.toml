[project]
name = "paper-evidence-toolchain"
version = "0.1.0"
description = "Isolated, downstream-only plotting toolchain for rendering Phase 2B paper evidence figures from the sealed generation-2 scientific summary. Never a scientific-computation dependency."
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.6",
    "when-tta-hurts",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.uv.sources]
when-tta-hurts = { path = "../..", editable = true }
