<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label-Preservation Annotation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:#15171b; color:#e6e8eb; }
  header { position:sticky; top:0; background:#1d2026; border-bottom:1px solid #2c313a;
           padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  #bar { flex:1; height:8px; background:#2c313a; border-radius:4px; overflow:hidden; min-width:120px; }
  #bar > div { height:100%; background:#4c9aff; width:0%; transition:width .15s; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 96px; }
  .pos { color:#9aa4b2; font-size:13px; }
  .meta { font-size:18px; font-weight:600; margin:4px 0 18px; }
  .meta .tag { display:inline-block; background:#2c313a; border-radius:4px; padding:1px 8px;
               font-size:12px; font-weight:500; vertical-align:middle; margin-right:8px; text-transform:uppercase; letter-spacing:.03em; }
  .imgs { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  figure { margin:0; text-align:center; }
  figure img { width:256px; height:256px; image-rendering:pixelated; background:#000;
               border:1px solid #2c313a; border-radius:6px; display:block; }
  figcaption { margin-top:6px; font-size:12px; letter-spacing:.08em; color:#9aa4b2; }
  .scores { display:flex; gap:12px; justify-content:center; margin:28px 0 8px; }
  .scores button { flex:1; max-width:220px; padding:16px 10px; font-size:15px; font-weight:600;
                   background:#232830; color:#e6e8eb; border:2px solid #2c313a; border-radius:8px; cursor:pointer; }
  .scores button:hover { border-color:#4c9aff; }
  .scores button.sel { background:#4c9aff; border-color:#4c9aff; color:#0b0d10; }
  .scores button small { display:block; font-weight:500; font-size:11px; opacity:.8; margin-top:3px; }
  .nav { display:flex; justify-content:space-between; margin-top:20px; }
  .nav button { padding:8px 16px; background:#232830; color:#e6e8eb; border:1px solid #2c313a; border-radius:6px; cursor:pointer; }
  .hint { text-align:center; color:#7b8494; font-size:12px; margin-top:22px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#1d2026; border-top:1px solid #2c313a;
           padding:10px 16px; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  footer button { padding:9px 18px; background:#4c9aff; color:#0b0d10; border:0; border-radius:6px; font-weight:600; cursor:pointer; }
  footer button.ghost { background:#232830; color:#e6e8eb; border:1px solid #2c313a; }
  #msg { color:#7b8494; font-size:12px; }
  dialog { background:#1d2026; color:#e6e8eb; border:1px solid #2c313a; border-radius:8px; max-width:520px; width:92%; }
  dialog textarea { width:100%; height:260px; background:#0f1114; color:#e6e8eb; border:1px solid #2c313a;
                    border-radius:6px; font:12px/1.4 ui-monospace,Menlo,monospace; padding:8px; }
  dialog .row { display:flex; gap:10px; justify-content:flex-end; margin-top:10px; }
</style>
</head>
<body>
<header>
  <span class="pos" id="count">0 / 0</span>
  <div id="bar"><div></div></div>
  <span class="pos" id="left"></span>
</header>
<main>
  <div class="pos" id="posline"></div>
  <div class="meta"><span class="tag" id="ds"></span><span id="cls"></span></div>
  <div class="imgs">
    <figure><img id="imgClean" alt="clean"><figcaption>CLEAN ORIGINAL</figcaption></figure>
    <figure><img id="imgAug" alt="augmented"><figcaption>AUGMENTED VIEW</figcaption></figure>
  </div>
  <div class="scores">
    <button data-s="0">0 &mdash; gone<small>cropped out / unrecognisable smear</small></button>
    <button data-s="1">1 &mdash; damaged<small>blurred / recoloured / clipped, still tells</small></button>
    <button data-s="2">2 &mdash; fine<small>content clearly still there</small></button>
  </div>
  <div class="nav">
    <button id="prev">&larr; Prev</button>
    <button id="next">Next &rarr;</button>
  </div>
  <div class="hint">keys: <b>0</b> / <b>1</b> / <b>2</b> score &amp; advance &nbsp;&middot;&nbsp; <b>&larr;</b> <b>&rarr;</b> move &nbsp;&middot;&nbsp; progress saved automatically</div>
</main>
<footer>
  <span id="msg"></span>
  <button id="copy">Copy scores CSV</button>
  <button class="ghost" id="jumpUnscored">Next unscored</button>
</footer>
<dialog id="dlg">
  <p style="margin-top:0">Paste this into <code>human_scores.csv</code> (replace the whole file), then run<br>
  <code>uv run python scripts/label_preservation_audit.py --with-human</code></p>
  <textarea id="csv" readonly></textarea>
  <div class="row"><button class="ghost" id="dlBtn">Download file</button><button id="close">Close</button></div>
</dialog>

const KEY = "labelpres_scores_v1_" + ITEMS.length;
let scores = {};
try { scores = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
let i = 0;
const $ = s => document.querySelector(s);

function render() {
  const it = ITEMS[i];
  $("#posline").textContent = "Item " + (i+1) + " of " + ITEMS.length;
  $("#ds").textContent = it.dataset;
  $("#cls").textContent = it.cls;
  $("#imgClean").src = it.clean;
  $("#imgAug").src = it.aug;
  document.querySelectorAll(".scores button").forEach(b => {
    b.classList.toggle("sel", String(scores[it.id]) === b.dataset.s);
  });
  const done = Object.keys(scores).length;
  $("#count").textContent = done + " / " + ITEMS.length;
  $("#left").textContent = (ITEMS.length - done) + " left";
  $("#bar").firstElementChild.style.width = (100*done/ITEMS.length) + "%";
}
function setScore(s) {
  scores[ITEMS[i].id] = s;
  localStorage.setItem(KEY, JSON.stringify(scores));
  if (i < ITEMS.length - 1) i++;
  render();
}
function go(d) { i = Math.max(0, Math.min(ITEMS.length-1, i+d)); render(); }

document.querySelectorAll(".scores button").forEach(b =>
  b.addEventListener("click", () => setScore(Number(b.dataset.s))));
$("#prev").onclick = () => go(-1);
$("#next").onclick = () => go(1);
$("#jumpUnscored").onclick = () => {
  for (let k=0;k<ITEMS.length;k++){ const j=(i+1+k)%ITEMS.length; if(scores[ITEMS[j].id]===undefined){ i=j; render(); return; } }
  $("#msg").textContent = "all items scored";
};
document.addEventListener("keydown", e => {
  if (["0","1","2"].includes(e.key)) { setScore(Number(e.key)); }
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
});
function buildCSV() {
  let out = "item_id,score\n";
  let missing = 0;
  for (const it of ITEMS) {
    const v = scores[it.id];
    if (v === undefined) missing++;
    out += it.id + "," + (v === undefined ? "" : v) + "\n";
  }
  return { out, missing };
}
$("#copy").onclick = async () => {
  const { out, missing } = buildCSV();
  $("#csv").value = out;
  $("#dlg").showModal();
  try { await navigator.clipboard.writeText(out); $("#msg").textContent = missing ? (missing+" still blank") : "copied to clipboard"; }
  catch(e) { $("#msg").textContent = "select text and copy manually" + (missing? " ("+missing+" blank)":""); }
};
$("#close").onclick = () => $("#dlg").close();
$("#dlBtn").onclick = () => {
  const blob = new Blob([buildCSV().out], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "human_scores.csv"; a.click();
};
render();
</script>
